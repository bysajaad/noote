name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vsce package
      - run: gh release create "${{ github.ref_name }}" *.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
